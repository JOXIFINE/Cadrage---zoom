<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Infinite Scroll</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  background:black;
  overflow:hidden;
  width:100%;
  height:100%;
}

#container{
  width:100%;
  height:100vh;
  overflow-y:scroll;
  -webkit-overflow-scrolling:touch;
}

#track{
  display:flex;
  flex-direction:column;
}

.image{
  width:100%;
  flex-shrink:0;
}

.image img{
  width:100%;
  height:auto;
  display:block;
}

</style>
</head>

<body>

<div id="container">
  <div id="track"></div>
</div>

<script>

const images = [
  "A.jpg",
  "B.jpg",
  "C.jpg"
];

const track = document.getElementById("track");

// On répète plusieurs fois
const repeated = [...images, ...images, ...images];

repeated.forEach(src => {

  const div = document.createElement("div");

  div.className = "image";

  const img = document.createElement("img");

  img.src = src;

  div.appendChild(img);

  track.appendChild(div);

});

const container = document.getElementById("container");

// attendre chargement images
window.onload = () => {

  const firstLoopHeight = track.scrollHeight / 3;

  // démarrer au milieu
  container.scrollTop = firstLoopHeight;

  container.addEventListener("scroll", () => {

    // descendre
    if(container.scrollTop >= firstLoopHeight * 2){

      container.scrollTop -= firstLoopHeight;

    }

    // remonter
    if(container.scrollTop <= 0){

      container.scrollTop += firstLoopHeight;

    }

  });

};

</script>

</body>
</html>
