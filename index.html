<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Scroll Infini</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html, body{
      height:auto;
      object-fit:contain;
      overflow:hidden;
      background:black;
      font-family:Arial, sans-serif;
    }

    #scroll-container{
      width:100%;
      height:100vh;
      overflow-y:scroll;
      -webkit-overflow-scrolling:touch;
    }

    .image{
      width:100%;
      height:100vh;
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      flex-shrink:0;
    }

    #track{
      display:flex;
      flex-direction:column;
    }

    .info{
      position:fixed;
      top:20px;
      left:20px;
      z-index:10;
      color:white;
      background:rgba(0,0,0,0.5);
      padding:10px 15px;
      border-radius:10px;
    }
  </style>
</head>

<body>

<div class="info">
  Scroll infini A → B → C
</div>

<div id="scroll-container">
  <div id="track"></div>
</div>

<script>

const images = [
  "A.jpg",
  "B.jpg",
  "C.jpg"
];

const track = document.getElementById("track");

// On répète les images plusieurs fois
const loopImages = [...images, ...images, ...images];

loopImages.forEach(src => {

  const div = document.createElement("div");

  div.className = "image";

  div.style.backgroundImage = `url(${src})`;

  track.appendChild(div);

});

const container = document.getElementById("scroll-container");

const oneLoopHeight = window.innerHeight * images.length;

// On démarre au milieu
container.scrollTop = oneLoopHeight;

container.addEventListener("scroll", () => {

  // Si on descend trop bas
  if(container.scrollTop >= oneLoopHeight * 2){

    container.scrollTop -= oneLoopHeight;

  }

  // Si on remonte trop haut
  if(container.scrollTop <= 0){

    container.scrollTop += oneLoopHeight;

  }

});

</script>

</body>
</html>
